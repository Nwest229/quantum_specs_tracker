name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Run lint (ruff check + format --check)
        run: uv run --group dev nox -s lint fmt

  typecheck-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Run typecheck (mypy --strict)
        run: uv run --group dev nox -s typecheck --python ${{ matrix.python-version }}
      - name: Run tests (pytest + coverage)
        run: uv run --group dev nox -s tests --python ${{ matrix.python-version }}
