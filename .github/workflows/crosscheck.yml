name: crosscheck

# Native cross-check: poll qBraid AND the providers' own APIs (AWS Braket, IBM)
# at one instant and flag where qBraid's normalised status disagrees with the
# native one (qBraid caches, so it can lag). Writes data/crosscheck.json +
# data/crosscheck_log.csv only — it never touches uptime.json, so it can't
# conflict with the 45-min qBraid poller. Runs less often since it installs SDKs.
on:
  schedule:
    - cron: "17 */6 * * *"    # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crosscheck
  cancel-in-progress: false

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native SDKs
        run: pip install amazon-braket-sdk qiskit-ibm-runtime

      - name: Cross-check qBraid vs AWS Braket + IBM
        env:
          QBRAID_API_KEY:        ${{ secrets.QBRAID_API_KEY }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
          IBM_QUANTUM_TOKEN:     ${{ secrets.IBM_QUANTUM_TOKEN }}
        run: python -m qscrape.uptime crosscheck

      - name: Commit cross-check snapshot + log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/crosscheck.json data/crosscheck_log.csv
          git commit -m "crosscheck: $(date -u +%FT%TZ)" || { echo "no changes"; exit 0; }
          git pull --rebase --autostash
          git push
