name: refresh-specs

# Cloud cron: re-runs the spec scraper (incl. live AWS Braket device data, and
# IBM once its instance is set) and commits the refreshed data/backends.json.
# Keeps the hardware comparison current without running anything locally.
on:
  schedule:
    - cron: "23 5 * * *"    # daily ~05:23 UTC (calibration data changes ~daily)
  workflow_dispatch: {}      # run on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-specs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional adapters
        run: pip install amazon-braket-sdk jsonschema beautifulsoup4

      - name: Scrape (AWS Braket live; IBM if instance+token set; else skips cleanly)
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
          IBM_QUANTUM_TOKEN:     ${{ secrets.IBM_QUANTUM_TOKEN }}
        run: python -m qscrape

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backends.json data/changelog.json
          git commit -m "specs: refresh $(date -u +%FT%TZ)" || { echo "no changes"; exit 0; }
          git pull --rebase --autostash
          git push
