[project]
name = "qscrape"
version = "0.1.0"
description = "A provenance-first scraper and pipeline for commercial quantum backend specs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nwest229" }]
dependencies = [
    "jsonschema>=4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
scrape = ["beautifulsoup4>=4.11"]
xlsx = ["openpyxl>=3.1"]
ibm = ["qiskit-ibm-runtime>=0.20"]
braket = ["amazon-braket-sdk>=1.70"]
all = [
    "beautifulsoup4>=4.11",
    "openpyxl>=3.1",
    "qiskit-ibm-runtime>=0.20",
    "amazon-braket-sdk>=1.70",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "nox>=2024.10.9",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
    "types-jsonschema>=4.23.0",
]

[project.scripts]
qscrape = "qscrape.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qscrape"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "C4", "PTH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PTH"]
"noxfile.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["qscrape"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "bs4.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qiskit_ibm_runtime.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "braket.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=src/qscrape --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["src/qscrape"]

[tool.coverage.report]
fail_under = 0
show_missing = true
