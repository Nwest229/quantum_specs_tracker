<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Availability Tracker</title>
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --line:#272b35; --fg:#e6e8ee; --muted:#8b93a7;
    --accent:#6ea8fe; --up:#3fb68b; --unsched:#e06c75; --sched:#e0a34e; --off:#5a6072; --chip:#232734; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  h1{font-size:17px;margin:0;font-weight:650;}
  .sub{color:var(--muted);font-size:12.5px;}
  .controls{margin-left:auto;display:flex;gap:10px;align-items:center;}
  button,label.file{background:var(--chip);color:var(--fg);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;}
  button:hover,label.file:hover{border-color:var(--accent);}
  input[type=file]{display:none;}
  a.navlink{background:var(--chip);color:var(--fg);border:1px solid var(--line);padding:7px 12px;border-radius:8px;font-size:13px;text-decoration:none;}
  a.navlink:hover{border-color:var(--accent);color:var(--accent);}
  .wrap{padding:18px 22px 60px;max-width:1160px;}
  h2{font-size:14px;color:var(--muted);font-weight:600;margin:22px 0 12px;text-transform:uppercase;letter-spacing:.04em;}
  .muted{color:var(--muted);}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;}

  /* step grids (companies / machines) */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
  .bigcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;cursor:pointer;font:inherit;color:var(--fg);}
  .bigcard:hover{border-color:var(--accent);}
  .bc-title{font-size:16px;font-weight:650;margin-bottom:5px;}
  .bc-sub{color:var(--muted);font-size:12.5px;margin-top:2px;}

  /* breadcrumb */
  .crumb{font-size:13px;margin-bottom:14px;color:var(--fg);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .crumblink{color:var(--accent);cursor:pointer;text-decoration:none;}
  .crumblink:hover{text-decoration:underline;}

  /* range pills */
  .pickrow{display:flex;align-items:center;gap:10px;margin:6px 0 12px;flex-wrap:wrap;}
  .picklbl{color:var(--muted);font-size:12px;min-width:52px;font-weight:600;}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap;}
  .rangebtn{background:var(--chip);color:var(--muted);border:1px solid var(--line);padding:5px 15px;border-radius:20px;cursor:pointer;font-size:12.5px;}
  .rangebtn:hover{border-color:var(--accent);}
  .rangebtn.active{border-color:var(--accent);color:var(--accent);}

  /* machine header + schedule */
  #machinehead{margin:4px 0 10px;}
  #machinehead .mname{font-size:17px;font-weight:650;}
  #machinehead .mmeta{color:var(--muted);font-size:12.5px;margin-top:3px;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px;}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:middle;}
  .schedwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;overflow-x:auto;}
  .schedwrap svg{display:block;}
  .schedhdr text{fill:var(--muted);}
  svg text{fill:var(--muted);font-size:10.5px;}

  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;margin-top:6px;}
  th,td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px;}
  th{color:var(--muted);font-weight:600;}
  .tag{font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid;}
  .tag.unscheduled{color:var(--unsched);border-color:var(--unsched);}
  .tag.outage{color:#b5545e;border-color:#b5545e;}
  .tag.scheduled{color:var(--sched);border-color:var(--sched);}
  .tag.ongoing{color:var(--sched);border-color:var(--sched);}
  .empty{color:var(--muted);padding:14px 0;}
  .tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);padding:6px 9px;border-radius:7px;font-size:12px;z-index:99;display:none;max-width:280px;}
  .banner{background:#1c2130;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--muted);font-size:12.5px;margin-bottom:12px;}

  /* compare-across-providers panel */
  .cmp-toggle{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--fg);cursor:pointer;}
  .cmp-toggle:hover{border-color:var(--accent);}
  .cmp-toggle #cmpCaret{color:var(--accent);margin-right:4px;}
  .cmp-body{margin-top:10px;display:flex;flex-direction:column;gap:12px;}
  .cmp-row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;overflow-x:auto;}
  .cmp-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
  .cmp-plat{font-size:14px;font-weight:650;}
  .cmp-badge{font-size:10.5px;padding:1px 8px;border-radius:20px;border:1px solid var(--accent);color:var(--accent);}
  .cmp-stat{font-size:12.5px;}
  .cmp-up{font-size:12.5px;margin-left:auto;}

  /* OEE loss breakdown */
  .oee-head{font-size:13.5px;margin:2px 0 10px;}
  .oee-wf{display:flex;height:20px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--off);}
  .oee-wf .wf-seg{height:100%;}
  .oee-cap{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:7px 0 16px;}
  .oee-cap i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;}
  .lossbars{display:flex;flex-direction:column;gap:9px;}
  .lossrow{display:grid;grid-template-columns:130px 1fr 150px;align-items:center;gap:12px;}
  .losslbl{font-size:12.5px;}
  .losstrack{height:14px;background:var(--chip);border:1px solid var(--line);border-radius:7px;overflow:hidden;}
  .lossfill{height:100%;}
  .lossval{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;}
  .oee-note{font-size:11.5px;margin-top:14px;line-height:1.55;}
</style>
</head>
<body>
<header>
  <div>
    <h1>Device Availability Tracker</h1>
    <div class="sub" id="subtitle">Load <code>data/uptime.json</code> to begin</div>
  </div>
  <div class="controls">
    <a class="navlink" href="viewer.html">← Spec tracker</a>
    <label class="file">Open JSON<input type="file" id="file" accept="application/json,.json"></label>
    <button id="reload">↻ Reload</button>
  </div>
</header>

<div class="wrap">
  <div id="banner"></div>
  <div id="view"></div>
</div>

<div class="tip" id="tip"></div>

<script>
let REPORT=null, SCHED={}, COMPANY=null, MACHINE=null, RANGE="week";
const RANGES={day:864e5, week:6048e5, month:2592e6};
const RANGE_LABELS={day:"Day", week:"Week", month:"Month"};
const CLS_COLOR={unscheduled:"var(--unsched)", scheduled:"var(--sched)", "off-hours":"var(--off)", outage:"#b5545e"};
const WEEKDAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const COMPANY_NAMES={iqm:"IQM",ibm:"IBM",ionq:"IonQ",rigetti:"Rigetti",quera:"QuEra",aqt:"AQT",
  pasqal:"Pasqal",quantinuum:"Quantinuum",oxford:"Oxford Ionics",aws:"AWS",qbraid:"qBraid",
  azure:"Azure",openquantum:"OpenQuantum",other:"Other"};
// the first qrn segment = the platform/API a machine is reachable on
const PLATFORM_NAMES={aws:"AWS Braket",azure:"Azure Quantum",ibm:"IBM Quantum",ionq:"IonQ (direct)",
  rigetti:"Rigetti (direct)",openquantum:"OpenQuantum",qbraid:"qBraid",other:"Other"};

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function statusColor(s){ return (s==="ONLINE") ? "var(--up)" : (/(POLL_ERROR|UNKNOWN|NOT_FOUND)/.test(s) ? "var(--off)" : "var(--unsched)"); }
function fmtDur(sec){ if(sec==null) return "—";
  const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60);
  return d? `${d}d ${h}h` : (h? `${h}h ${m}m` : (m? `${m}m` : `${sec}s`)); }

function parseDev(id){ const p=String(id).split(":");
  return p.length>=4 ? {provider:p[0],company:p[1],name:p.slice(3).join(":")} : {provider:"",company:"other",name:String(id)}; }
function companyLabel(c){ return COMPANY_NAMES[c] || (c?c.toUpperCase():"Other"); }
function mName(id){ const d=parseDev(id); return d.name ? d.name.charAt(0).toUpperCase()+d.name.slice(1) : id; }
function mRoute(id){ const d=parseDev(id); return d.provider ? "via "+d.provider : ""; }
function byCompany(devices){ const g={}; devices.forEach(d=>{ (g[parseDev(d.device).company]=g[parseDev(d.device).company]||[]).push(d); }); return g; }
function companiesSorted(g){ return Object.keys(g).sort((a,b)=>companyLabel(a).localeCompare(companyLabel(b))); }
function platformLabel(p){ return PLATFORM_NAMES[p] || (p?p.toUpperCase():"Other"); }

function rangeWindow(){
  const to=Date.parse(REPORT.window.to), wf=Date.parse(REPORT.window.from);
  const from=to-(RANGES[RANGE]||RANGES.week);
  return {from, to, covFrom:Math.max(from,wf), covTo:to};
}
function downSeconds(d,a,b){ let s=0;
  (d.intervals||[]).forEach(iv=>{ const x=Math.max(a,Date.parse(iv.start)), y=Math.min(b,Date.parse(iv.end)); if(y>x) s+=(y-x)/1000; });
  return s; }

/* ---------- OEE loss model ----------
   All Time − Schedule Loss = Planned Production − Availability Loss = Run Time
   − Performance Loss = Net Run Time − Quality Loss = Fully Productive.
   We can only *measure* availability loss (downtime) and, where a manual
   schedule exists, schedule loss. Performance & quality need job-level data. */
function downByClass(d,a,b,classes){ let s=0;
  (d.intervals||[]).forEach(iv=>{ if(classes && classes.indexOf(iv.class)<0) return;
    const ivEnd = iv.ongoing ? Math.max(Date.parse(iv.end),b) : Date.parse(iv.end);
    const x=Math.max(a,Date.parse(iv.start)), y=Math.min(b,ivEnd); if(y>x) s+=(y-x)/1000; });
  return s; }
function overlapSec(a,b,list){ let s=0; (list||[]).forEach(w=>{
  const x=Math.max(a,Date.parse(w.start)), y=Math.min(b,Date.parse(w.end)); if(y>x) s+=(y-x)/1000; }); return s; }
function plannedUpSec(a,b,wins){ // seconds inside any weekly UTC window (hourly step)
  const H=36e5; let up=0;
  for(let t=a;t<b;t+=H){ const seg=(Math.min(b,t+H)-t)/1000, dt=new Date(t);
    const cfgDay=(dt.getUTCDay()+6)%7, mins=dt.getUTCHours()*60+dt.getUTCMinutes();
    const inWin=wins.some(w=>{ if((w.days||[]).indexOf(cfgDay)<0) return false;
      const [sh,sm]=w.start.split(":").map(Number), [eh,em]=w.end.split(":").map(Number);
      return mins>=sh*60+sm && mins<eh*60+em; });
    if(inWin) up+=seg; }
  return up; }
function scheduleLoss(devId,a,b){ const sc=SCHED[devId], total=(b-a)/1000;
  if(!sc) return {sec:0, defined:false};                 // no schedule → assume 24/7 intent
  let loss=overlapSec(a,b,sc.maintenance);               // planned maintenance = deliberate downtime
  const wins=sc.available_windows||[];
  if(wins.length && !sc.available_24_7) loss += total - plannedUpSec(a,b,wins);
  return {sec:Math.min(loss,total), defined:true}; }
function oeeFor(d){
  const {covFrom,covTo}=rangeWindow(), total=(covTo-covFrom)/1000;
  const sl=scheduleLoss(d.device,covFrom,covTo);
  const unsched=downByClass(d,covFrom,covTo,["unscheduled"]);
  const outage=downByClass(d,covFrom,covTo,["outage"]);
  const availLoss=unsched+outage;                        // unplanned downtime during planned time
  const planned=Math.max(0,total-sl.sec);
  const productive=Math.max(0,planned-availLoss);        // run time (perf/quality unmeasured → best case)
  return {total, schedLoss:sl.sec, schedDefined:sl.defined, availLoss, unsched, outage,
          planned, productive, availability: planned>0 ? productive/planned : null}; }

/* ---------- step router ---------- */
function render(){
  if(!REPORT) return;
  document.getElementById("subtitle").textContent =
    `${REPORT.devices.length} devices · data from ${(REPORT.window.from||"—").slice(0,10)} · generated ${(REPORT.generated||"").slice(0,16)} UTC`;
  const g=byCompany(REPORT.devices);
  if(!COMPANY || !g[COMPANY]) return renderCompanies(g);
  if(!MACHINE || !machinesOf(COMPANY,g).some(m=>m.rep.device===MACHINE)) return renderMachines(g);
  renderScheduleView(g);
}

/* group a company's devices into unique physical machines, each with its provider routes */
function machinesOf(company,g){
  const seen={}; (g[company]||[]).forEach(d=>{ const k=parseDev(d.device).name.toLowerCase(); (seen[k]=seen[k]||[]).push(d); });
  return Object.keys(seen).sort().map(k=>{
    const routes=seen[k].sort((a,b)=>platformLabel(parseDev(a.device).provider).localeCompare(platformLabel(parseDev(b.device).provider)));
    return {name:mName(routes[0].device), routes, rep:routes[0]};
  });
}
function routesFor(deviceId){
  const d0=parseDev(deviceId), k=d0.company+"::"+d0.name.toLowerCase();
  return REPORT.devices.filter(x=>{ const p=parseDev(x.device); return p.company+"::"+p.name.toLowerCase()===k; })
    .sort((a,b)=>platformLabel(parseDev(a.device).provider).localeCompare(platformLabel(parseDev(b.device).provider)));
}

/* step 1 — companies */
function renderCompanies(g){
  const cards=companiesSorted(g).map(c=>{
    const ms=g[c], online=ms.filter(d=>d.current_status==="ONLINE").length, nmach=machinesOf(c,g).length;
    return `<button class="bigcard" data-c="${c}">
      <div class="bc-title">${esc(companyLabel(c))}</div>
      <div class="bc-sub">${nmach} machine${nmach>1?"s":""} · ${ms.length} provider route${ms.length>1?"s":""}</div>
      <div class="bc-sub"><span class="dot" style="background:var(--up)"></span>${online} online · ${ms.length-online} not</div>
    </button>`;
  }).join("");
  document.getElementById("view").innerHTML = `<h2>Companies</h2><div class="grid">${cards||'<div class="empty">No devices yet.</div>'}</div>`;
  document.querySelectorAll(".bigcard").forEach(b=> b.onclick=()=>{ COMPANY=b.dataset.c; MACHINE=null; render(); });
}

/* step 2 — machines of a company (deduped across provider routes) */
function renderMachines(g){
  const mm=machinesOf(COMPANY,g);
  const cards=mm.map(m=>{
    const online=m.routes.filter(r=>r.current_status==="ONLINE").length, n=m.routes.length;
    const plats=m.routes.map(r=>platformLabel(parseDev(r.device).provider)).join(", ");
    return `<button class="bigcard" data-m="${esc(m.rep.device)}">
      <div class="bc-title">${esc(m.name)}</div>
      <div class="bc-sub">${n>1?n+" providers":"1 provider"} · ${esc(plats)}</div>
      <div class="bc-sub"><span class="dot" style="background:${online?'var(--up)':'var(--off)'}"></span>${online}/${n} online</div>
    </button>`;
  }).join("");
  document.getElementById("view").innerHTML =
    `<div class="crumb"><a class="crumblink" id="toCompanies">Companies</a><span class="muted">›</span><b>${esc(companyLabel(COMPANY))}</b></div>
     <h2>${esc(companyLabel(COMPANY))} · machines</h2><div class="grid">${cards}</div>`;
  document.getElementById("toCompanies").onclick=()=>{ COMPANY=null; MACHINE=null; render(); };
  document.querySelectorAll(".bigcard").forEach(b=> b.onclick=()=>{ MACHINE=b.dataset.m; render(); });
}

/* step 3 — one machine's schedule */
function renderScheduleView(g){
  const d=g[COMPANY].find(x=>x.device===MACHINE);
  const {covFrom,covTo}=rangeWindow(); const effSpan=(covTo-covFrom)/1000;
  const up = effSpan>0 ? Math.round((1-downSeconds(d,covFrom,covTo)/effSpan)*10000)/100 : null;
  const rbtns=Object.keys(RANGES).map(k=>`<button class="rangebtn${k===RANGE?' active':''}" data-r="${k}">${RANGE_LABELS[k]}</button>`).join("");
  document.getElementById("view").innerHTML=`
    <div class="crumb">
      <a class="crumblink" id="toCompanies">Companies</a><span class="muted">›</span>
      <a class="crumblink" id="toMachines">${esc(companyLabel(COMPANY))}</a><span class="muted">›</span>
      <b>${esc(mName(d.device))} <span class="muted" style="font-weight:400">${esc(mRoute(d.device))}</span></b>
    </div>
    <div id="machinehead">
      <div class="mname">${esc(mName(d.device))} <span class="muted" style="font-size:13px;font-weight:400">${esc(mRoute(d.device))}</span>
        <span class="dot" style="background:${statusColor(d.current_status)}"></span> <span style="font-size:13px;font-weight:500">${esc(d.current_status)}</span></div>
      <div class="mmeta">uptime ${up==null?"—":"<b>"+up+"%</b>"} · past ${RANGE_LABELS[RANGE].toLowerCase()} · last seen ${esc((d.last_seen||"").slice(0,16))} UTC</div>
    </div>
    <div class="pickrow"><span class="picklbl">View</span><div class="btnrow">${rbtns}</div></div>
    <div class="legend">
      <span><i style="background:var(--up)"></i>online</span>
      <span><i style="background:#b5545e"></i>outage</span>
      <span><i style="background:var(--unsched)"></i>unscheduled</span>
      <span><i style="background:var(--sched)"></i>scheduled maintenance</span>
      <span><i style="background:var(--off)"></i>no data</span>
    </div>
    <div id="schedule"></div>
    <h2>OEE loss breakdown</h2>
    <div id="oee"></div>
    <h2>Outages <span class="muted" id="outCount"></span></h2>
    <div id="outages"></div>
    <h2>Compare across providers</h2>
    <div id="compare"></div>`;
  document.getElementById("toCompanies").onclick=()=>{ COMPANY=null; MACHINE=null; render(); };
  document.getElementById("toMachines").onclick=()=>{ MACHINE=null; render(); };
  document.querySelectorAll(".pickrow .rangebtn").forEach(b=> b.onclick=()=>{ RANGE=b.dataset.r; renderScheduleView(g); });
  document.getElementById("schedule").innerHTML = agendaHTML(d);
  renderOEE(d);
  renderOutages(d);
  renderCompare(d);
  wireTips();
}

/* per-machine OEE loss bars for the selected range */
function renderOEE(d){
  const box=document.getElementById("oee"); if(!box) return;
  const o=oeeFor(d), pct=s=> o.total>0 ? s/o.total*100 : 0;
  const rangeName=RANGE_LABELS[RANGE].toLowerCase();
  const availPct = o.availability==null?null:Math.round(o.availability*1000)/10;
  const gp=pct(o.productive), ap=pct(o.availLoss), sp=pct(o.schedLoss);
  const bar=(label,p,color,opts)=>{ opts=opts||{};
    const w = p==null?0:Math.max(p>0?1.2:0,Math.min(100,p));
    const fill = opts.hatch
      ? `background:repeating-linear-gradient(45deg,${color},${color} 5px,transparent 5px,transparent 11px);opacity:.55`
      : `background:${color}`;
    const val = opts.text!=null ? opts.text : (p==null?"—":p.toFixed(1)+"%");
    return `<div class="lossrow">
      <div class="losslbl">${esc(label)}</div>
      <div class="losstrack"${opts.title?` title="${esc(opts.title)}"`:""}><div class="lossfill" style="width:${w}%;${fill}"></div></div>
      <div class="lossval ${opts.muted?'muted':''}">${val}</div></div>`; };
  const availTitle=[o.unsched?`unscheduled ${fmtDur(o.unsched)}`:"", o.outage?`no-schedule outage ${fmtDur(o.outage)}`:""].filter(Boolean).join(" · ");
  box.innerHTML=`
    <div class="oee-head">Availability ${availPct==null?"—":"<b>"+availPct+"%</b>"} <span class="muted">· planned production that was actually up · past ${rangeName}</span></div>
    <div class="oee-wf" title="the whole range = 100%">
      <div class="wf-seg" style="width:${gp}%;background:var(--up)"></div>
      <div class="wf-seg" style="width:${ap}%;background:var(--unsched)"></div>
      <div class="wf-seg" style="width:${sp}%;background:var(--off)"></div>
    </div>
    <div class="oee-cap">
      <span><i style="background:var(--up)"></i>productive (best case) ${gp.toFixed(1)}%</span>
      <span><i style="background:var(--unsched)"></i>availability loss ${ap.toFixed(1)}%</span>
      <span><i style="background:var(--off)"></i>schedule loss ${sp.toFixed(1)}%</span>
    </div>
    <div class="lossbars">
      ${bar("Schedule loss", o.schedDefined?sp:null, "var(--off)", o.schedDefined?{title:"planned maintenance + off-hours from your manual schedule"}:{text:"not defined · assumed 24/7",muted:true})}
      ${bar("Availability loss", ap, "var(--unsched)", {title:availTitle||"unplanned downtime"})}
      ${bar("Performance loss", null, "var(--sched)", {hatch:true,text:"not measured",muted:true})}
      ${bar("Quality loss", null, "#a78bfa", {hatch:true,text:"not measured",muted:true})}
    </div>
    <div class="oee-note muted"><b>Availability loss</b> is measured directly from status polling. <b>Schedule loss</b> comes from your manual schedule where one exists (else assumed 24/7). <b>Performance</b> &amp; <b>quality</b> loss need job-level data (shot timing, error rates) the status API doesn't expose — shown hatched, never estimated.</div>`;
}

/* collapsible panel: the SAME machine on every other provider route, for side-by-side comparison */
function renderCompare(d){
  const box=document.getElementById("compare"); if(!box) return;
  const routes=routesFor(d.device);
  if(routes.length<2){
    box.innerHTML=`<div class="empty">Only reachable via ${esc(platformLabel(parseDev(d.device).provider))} — no other provider to compare against.</div>`;
    return;
  }
  const others=routes.length-1;
  box.innerHTML=`<button class="cmp-toggle" id="cmpToggle"><span id="cmpCaret">▸</span> Compare this machine on ${others} other provider${others>1?"s":""}</button>
    <div id="cmpBody" class="cmp-body" hidden></div>`;
  const body=document.getElementById("cmpBody"), caret=document.getElementById("cmpCaret");
  document.getElementById("cmpToggle").onclick=()=>{
    if(!body.hidden){ body.hidden=true; caret.textContent="▸"; return; }
    body.hidden=false; caret.textContent="▾";
    const {covFrom,covTo}=rangeWindow(), effSpan=(covTo-covFrom)/1000;
    body.innerHTML=routes.map(r=>{
      const up=effSpan>0?Math.round((1-downSeconds(r,covFrom,covTo)/effSpan)*10000)/100:null;
      const cur=r.device===d.device, prov=parseDev(r.device).provider;
      return `<div class="cmp-row">
        <div class="cmp-head">
          <span class="cmp-plat">${esc(platformLabel(prov))}</span>
          ${cur?'<span class="cmp-badge">this view</span>':''}
          <span class="cmp-stat"><span class="dot" style="background:${statusColor(r.current_status)}"></span>${esc(r.current_status)}</span>
          <span class="cmp-up muted">uptime ${up==null?"—":"<b style='color:var(--fg)'>"+up+"%</b>"}</span>
        </div>
        ${agendaHTML(r)}
      </div>`;
    }).join("");
    wireTips();
  };
}

/* the day-by-day schedule (fixed-pixel SVG so text stays crisp, rows compact) */
function agendaHTML(d){
  const {from,to,covFrom,covTo}=rangeWindow();
  const D=864e5, start=Math.floor(from/D)*D, days=[];
  for(let t=start;t<=to;t+=D) days.push(t);
  const W=Math.max(560,Math.min(1080,(window.innerWidth||1000)-72)), m={l:150,r:12}, iw=W-m.l-m.r;
  const hx=frac=> m.l+frac*iw;
  let hdr=`<svg class="schedhdr" width="${W}" height="16" viewBox="0 0 ${W} 16">`;
  for(let h=0;h<=24;h+=6){ hdr+=`<text x="${hx(h/24)}" y="12" text-anchor="${h===0?'start':h===24?'end':'middle'}">${String(h).padStart(2,'0')}:00</text>`; }
  hdr+=`</svg>`;
  const rows=days.map(df=>{
    const dt=df+D, dd=new Date(df), lbl=`${WEEKDAY[dd.getUTCDay()]} ${dd.toISOString().slice(0,10)}`;
    const px=ms=> m.l + Math.max(0,Math.min(1,(ms-df)/D))*iw;
    let bars=`<rect x="${m.l}" y="4" width="${iw}" height="14" rx="2" fill="var(--off)" opacity="0.16"/>`;
    const oa=Math.max(df,covFrom), ob=Math.min(dt,covTo);
    if(ob>oa) bars+=`<rect x="${px(oa)}" y="4" width="${px(ob)-px(oa)}" height="14" rx="2" fill="var(--up)" opacity="0.32"/>`;
    for(let h=6;h<24;h+=6){ const x=px(df+h*36e5); bars+=`<line x1="${x}" y1="4" x2="${x}" y2="18" stroke="var(--line)"/>`; }
    (d.intervals||[]).forEach(iv=>{
      // an ongoing outage is still down "now" — extend it to the latest observation
      const ivEnd = iv.ongoing ? Math.max(Date.parse(iv.end), covTo) : Date.parse(iv.end);
      const s=Math.max(df,Date.parse(iv.start)), e=Math.min(dt,ivEnd); if(e<=s) return;
      const col=CLS_COLOR[iv.class]||"var(--unsched)";
      bars+=`<rect x="${px(s)}" y="4" width="${Math.max(iv.ongoing?4:2,px(e)-px(s))}" height="14" rx="2" fill="${col}" class="seg"
        data-t="${esc(lbl+' · '+iv.class+(iv.ongoing?' · ongoing (down now)':'')+' · '+iv.start.slice(11,16)+'→'+(iv.ongoing?'now':iv.end.slice(11,16))+' ('+fmtDur(iv.duration_s)+')')}"/>`;
    });
    return `<svg width="${W}" height="22" viewBox="0 0 ${W} 22"><text x="0" y="14">${lbl}</text>${bars}</svg>`;
  }).join("");
  return `<div class="schedwrap">${hdr}${rows}</div>`;
}

function renderOutages(d){
  const {from,to}=rangeWindow();
  const all=(d.intervals||[]).filter(iv=> !(Date.parse(iv.end)<=from || Date.parse(iv.start)>=to))
                             .sort((a,b)=>Date.parse(b.start)-Date.parse(a.start));
  document.getElementById("outCount").textContent=`(${all.length} · past ${RANGE_LABELS[RANGE].toLowerCase()})`;
  const box=document.getElementById("outages");
  if(!all.length){ box.innerHTML=`<div class="empty">No outages for this machine in this range. 🎉</div>`; return; }
  box.innerHTML=`<table><tr><th>Start (UTC)</th><th>End (UTC)</th><th>Duration</th><th>Status</th><th>Type</th></tr>`+
    all.map(iv=>`<tr>
      <td>${esc(iv.start.replace('T',' ').slice(0,16))}</td>
      <td>${esc(iv.ongoing?'— (ongoing)':iv.end.replace('T',' ').slice(0,16))}</td>
      <td>${fmtDur(iv.duration_s)}</td>
      <td>${esc((iv.statuses||[]).join(', '))}</td>
      <td><span class="tag ${iv.ongoing?'ongoing':esc(iv.class)}">${iv.ongoing?'ongoing':esc(iv.class)}</span></td>
    </tr>`).join("")+`</table>`;
}

function wireTips(){
  const tip=document.getElementById("tip");
  document.querySelectorAll(".seg").forEach(el=>{
    el.addEventListener("mousemove",e=>{tip.style.display="block";tip.textContent=el.dataset.t;
      tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";});
    el.addEventListener("mouseleave",()=>tip.style.display="none");
  });
}

/* ---------- loading ---------- */
function load(obj){ REPORT=obj; document.getElementById("banner").innerHTML=""; render(); }
document.getElementById("file").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return; f.text().then(t=>load(JSON.parse(t)));
});
document.getElementById("reload").addEventListener("click",()=>autoload(true));
window.addEventListener("resize",()=>{ if(REPORT&&COMPANY&&MACHINE) render(); });

function autoload(force){
  if(location.protocol==="file:" && !force){
    document.getElementById("banner").innerHTML=`<div class="banner">Serve the folder (<code>python3 -m http.server</code>) to auto-load <code>data/uptime.json</code>, or use <b>Open JSON</b>.</div>`;
    return;
  }
  Promise.all([
    fetch("data/uptime.json",{cache:"no-store"}).then(r=>r.ok?r.json():null),
    fetch("config/uptime_schedule.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)
  ]).then(([j,s])=>{ if(s&&s.devices) SCHED=s.devices;
      if(j) load(j);
      else document.getElementById("banner").innerHTML=`<div class="banner">No <code>data/uptime.json</code> yet — the poller needs to run at least once.</div>`; })
    .catch(()=>{});
}
autoload();
</script>
